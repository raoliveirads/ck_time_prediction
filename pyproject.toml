[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "chekin_time_prediction"
version = "0.0.1"
description = "Regression analysis to estimate checkin queue time"
authors = [
  { name = "Renan Amaral de Oliveira" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["chekin_time_prediction"]
include = ["pyproject.toml", "chekin_time_prediction/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["chekin_time_prediction"]
force-sort-within-sections = true

